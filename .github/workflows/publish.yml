# Lives in the PUBLIC repository (betterbugs/cli). The private source repo
# (bb-cli) pushes the built package here and creates the GitHub release, which
# runs this: publish to npm, render the Homebrew formula, update the tap.
# Secret (this repo): HOMEBREW_TAP_TOKEN, a fine-grained token for
# betterbugs/homebrew-tap only, Contents: Read and write.
# npm auth: trusted publishing (OIDC), no npm token. On npmjs.com, @betterbugs/cli
# → Settings → Trusted Publisher: GitHub Actions, betterbugs/cli, publish.yml.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write # attach betterbugs.rb to the release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Smoke test the bundle
        run: |
          node dist/index.js --version
          node dist/index.js agent-context --json > /dev/null

      # Trusted publishing needs npm 11.5.1+; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      # Prereleases (1.2.0-beta.1) go to the `next` dist-tag.
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          # A re-run after a later step failed: the version is already on npm.
          if [ "$(npm view "$name@$version" version 2> /dev/null)" = "$version" ]; then
            echo "$name@$version is already published; skipping."
          elif printf '%s' "$version" | grep -q -- '-'; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Render the Homebrew formula
        run: |
          version="$(node -p "require('./package.json').version")"
          node packaging/homebrew/render-formula.mjs "$version" betterbugs.rb

      - name: Attach the formula to the release
        run: gh release upload "$TAG" betterbugs.rb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

      # Prereleases stay out of the tap: `brew install` gets stable versions only.
      - name: Update the Homebrew tap
        if: ${{ !github.event.release.prerelease }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: copy betterbugs.rb from the release to Formula/ in betterbugs/homebrew-tap yourself."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/betterbugs/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp betterbugs.rb tap/Formula/betterbugs.rb
          cd tap
          git add Formula/betterbugs.rb
          if git diff --cached --quiet; then
            echo "The tap already has this formula."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "betterbugs ${TAG#v}"
          git push origin HEAD
